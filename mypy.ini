# mypy configuration for this repository.
#
# Scope:
#   1. The suite-level plotting modules under cpp/ (trex_plt_utils.py,
#      trex_da_plt_utils.py, and the trex_gvs/trex_scr/trex_spca variants).
#   2. The Python demo suites under Python/ (tsolvers, trex_selector_methods,
#      ml_methods, memory_mapping).
#
# Type-checking dependencies live in requirements-dev.txt -- notably
# pandas-stubs, since pandas ships no py.typed marker and is otherwise
# invisible to the checker.
#
# The Python demos live in per-demo subdirectories but import first-party
# helper modules (ts_demo_utils, dgp_gauss_snr, ...) that sit one level up, at
# the suite root. At runtime a sys.path.insert makes those importable; mypy
# never executes that line, so the suite roots are listed in mypy_path below
# instead -- otherwise every demo reports a spurious "cannot find module".
# These are first-party modules, NOT third-party libs: they need a search
# path, not a .pyi stub.
#
# Run from the repository root (relative mypy_path entries resolve against the
# current working directory, so the root is the intended launch point):
#   mypy cpp/trex_selector_methods/trex/trex_plt_utils.py \
#        cpp/trex_selector_methods/trex_da/trex_da_plt_utils.py
#   mypy Python/tsolvers/demo_ts_01_tlars/demo_ts_01_tlars.py

[mypy]
# Keep the default (permissive) strictness: these are plotting/demo scripts,
# not a typed library. The point of checking them is to catch real mistakes,
# not to annotate every local.
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Suite roots holding the first-party helper modules the demos import (see the
# header note). Relative to the repo root, where mypy is launched. Each entry is
# the directory that *contains* the helper .py files -- for trex_selector_methods
# the helpers live one level down, per sub-suite (trex/, trex_da/, ...), so the
# sub-suite dirs are listed, not the parent.
mypy_path = Python/tsolvers:Python/trex_selector_methods/trex:Python/trex_selector_methods/trex_da:Python/trex_selector_methods/trex_gvs:Python/trex_selector_methods/trex_screening:Python/trex_selector_methods/trex_spca:Python/ml_methods:Python/memory_mapping

# plotly ships no py.typed marker, and the only stub package (plotly-stubs) is
# still 0.1.x -- too immature to pin a figure suite to. Its imports are optional
# dependencies guarded by try/except ImportError, and nothing we annotate
# depends on their types, so leave them unanalysed rather than half-typed.
[mypy-plotly]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True
